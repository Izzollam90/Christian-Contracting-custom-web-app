<title>Maintenance Application</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field-ops app shell. Sticky top bar with business + role switch; side rail on desktop, bottom tab bar on phones; content in cards only where a record is an object. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#14202B; --muted:#5A6774; --line:#D4DAE1;
  --accent:#F2B705; --accent-ink:#7A5800; --on-accent:#14202B; --steel:#2D5A86;
  --ok:#1F7A4D; --ok-bg:#E2F3EA; --warn:#9A5B00; --warn-bg:#FCEFD6; --bad:#B3261E; --bad-bg:#FBE4E2; --info:#2D5A86; --info-bg:#E2ECF6; --idle:#5A6774; --idle-bg:#E8ECF0;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --surface-2:#1B2631; --ink:#E6EBF0; --muted:#94A2AF; --line:#2A3643;
  --accent:#F5C02E; --accent-ink:#F5C02E; --on-accent:#14202B; --steel:#86B4E2;
  --ok:#5CCB91; --ok-bg:#15392A; --warn:#F2B451; --warn-bg:#3A2A10; --bad:#FF8A80; --bad-bg:#43191A; --info:#86B4E2; --info-bg:#172E45; --idle:#94A2AF; --idle-bg:#222D38;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --surface-2:#1B2631; --ink:#E6EBF0; --muted:#94A2AF; --line:#2A3643;
  --accent:#F5C02E; --accent-ink:#F5C02E; --on-accent:#14202B; --steel:#86B4E2;
  --ok:#5CCB91; --ok-bg:#15392A; --warn:#F2B451; --warn-bg:#3A2A10; --bad:#FF8A80; --bad-bg:#43191A; --info:#86B4E2; --info-bg:#172E45; --idle:#94A2AF; --idle-bg:#222D38;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.65rem;line-height:1.1}
h3{font-size:1.2rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.85em}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#F3F5F7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
:root[data-theme="dark"] .top{background:#05090D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{background:#05090D}}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.brand b{font-family:var(--display);font-size:1.25rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand select{background:transparent;border:1px solid #3A4856;border-radius:6px;color:#C9D2DB;padding:3px 6px;font-size:.85rem;max-width:200px}
.brand select option{color:#14202B}
.roles{display:flex;background:#22303D;border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.roles button{border:0;background:transparent;color:#B9C4CE;padding:6px 11px;border-radius:6px;cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.roles-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:#8D9AA7;width:100%;display:none}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;gap:24px}
nav.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav.side .who{padding:10px 12px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
nav.side .who small{display:block;text-transform:uppercase;letter-spacing:.09em;font-size:.68rem;color:var(--muted)}
nav.side .who b{font-weight:600}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.navbtn .count{margin-left:auto;font-size:.75rem;background:var(--idle-bg);color:var(--muted);border-radius:99px;padding:0 7px}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;flex-wrap:wrap;align-items:end;gap:8px 16px}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sample{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line);padding:2px 8px;border-radius:99px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  nav.side{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:25;flex-direction:row;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:0}
  nav.side .who{display:none}
  .navbtn{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 4px;flex:1;min-width:0;text-align:center}
  .navbtn span.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .navbtn .count{display:none}
  .navbtn[aria-current="page"]{box-shadow:inset 0 3px 0 var(--accent);background:transparent}
  .brand select{max-width:150px}
}
@media (max-width:520px){ .roles{width:100%} .roles button{flex:1;padding:6px 4px;font-size:.82rem} }

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.ghost{background:transparent;border-color:transparent;color:var(--steel)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;color:var(--ink);font-weight:400}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:var(--info-bg);color:var(--info)} .s-scheduled{background:var(--idle-bg);color:var(--idle)}
.s-progress{background:var(--warn-bg);color:var(--warn)} .s-done{background:var(--ok-bg);color:var(--ok)} .s-bad{background:var(--bad-bg);color:var(--bad)}
.prio{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.prio.urgent{color:var(--bad)} .prio.high{color:var(--warn)} .prio.normal{color:var(--muted)}

/* work order list */
.wolist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wo{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.wo:first-child{border-top:0}
.wo:hover{background:var(--surface-2)}
.wo .id{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.wo .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wo .sub{grid-column:2/3;font-size:.85rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wo .end{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:end;gap:4px}
@media (max-width:520px){ .wo{grid-template-columns:minmax(0,1fr) auto} .wo .id{grid-column:1} .wo .t{grid-column:1} .wo .sub{grid-column:1} .wo .end{grid-row:1/4;grid-column:2} }
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--display);font-size:2rem;font-weight:600;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--steel)}
.bar .fill.acc{background:var(--accent)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){ .bar{grid-template-columns:96px minmax(0,1fr) 70px} }
.spark{width:100%;height:auto;max-width:100%;display:block}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.code{font-family:var(--mono);font-size:.8rem}

/* clock */
.clockface{display:flex;flex-direction:column;gap:14px}
.clock-status{display:flex;align-items:center;gap:14px}
.clock-dot{width:14px;height:14px;border-radius:50%;background:var(--idle);flex:none}
.clock-dot.on{background:var(--ok);box-shadow:0 0 0 5px var(--ok-bg)}
.timer{font-family:var(--mono);font-size:2rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.notice{border-radius:8px;padding:10px 12px;font-size:.9rem}
.notice.bad{background:var(--bad-bg);color:var(--bad)} .notice.ok{background:var(--ok-bg);color:var(--ok)} .notice.info{background:var(--info-bg);color:var(--info)} .notice.warn{background:var(--warn-bg);color:var(--warn)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,16,.5);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px;
  padding-top:calc(20px + env(safe-area-inset-top,0px))}
.sheet header{display:flex;align-items:start;gap:12px}
.sheet header .x{margin-left:auto}
dl.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;margin:0;font-size:.9rem}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--steel);margin-top:5px}
.timeline li::after{content:"";position:absolute;left:4px;top:17px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline small{color:var(--muted);display:block;font-size:.8rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps div{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.steps div.done{border-color:var(--accent);color:var(--ink)}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px 32px;gap:6px}
.doc{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.doc .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc table td,.doc table th{padding:5px 6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
@media (min-width:861px){.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.q{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .qh{display:flex;gap:10px;align-items:start}
.q .qh b{font-weight:600}
.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.check li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.tick{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:.75rem;font-weight:700;margin-top:2px}
.tick.y{background:var(--ok-bg);color:var(--ok)} .tick.p{background:var(--accent);color:var(--on-accent)} .tick.n{background:var(--idle-bg);color:var(--muted)}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>

<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#14202B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></div>
    <b>Maintenance</b>
    <select id="biz" aria-label="Business"></select>
  </div>
  <div class="roles" role="group" aria-label="View as" id="roles"></div>
</header>

<div class="shell">
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
(() => {
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 864e5, HR = 36e5;
const money = n => '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const money2 = n => '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD = t => new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtDT = t => new Date(t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const fmtDay = t => new Date(t).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const startOfDay = t => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const uid = p => p + '-' + Math.random().toString(36).slice(2,7);
const SLOTS = ['8–10 am','10 am–12 pm','1–3 pm','3–5 pm'];
const STATUS = ['New','Scheduled','In progress','Completed'];
const stCls = s => ({'New':'s-new','Scheduled':'s-scheduled','In progress':'s-progress','Completed':'s-done','Draft':'s-scheduled','Sent':'s-new','Approved':'s-done','Paid':'s-done','Overdue':'s-bad','Pending':'s-progress','Denied':'s-bad','Invited':'s-new','Active':'s-done'}[s]||'s-scheduled');
const pill = s => `<span class="pill ${stCls(s)}">${esc(s)}</span>`;
const ICON = {
  plus:'<path d="M12 5v14M5 12h14"/>', list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', board:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>', table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
// distance in metres between lat/lng pairs
function dist(a,b){ const R=6371000, r=x=>x*Math.PI/180; const dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const GEOFENCE = 200; // metres

// ---------- seed data (examples) ----------
function seed(){
  const now = Date.now(), today = startOfDay(now);
  const users = [
    {id:'u1',name:'Dana Whitfield',role:'customer',email:'dana.w@example.com',phone:'(555) 201-4410',status:'Active',siteId:'s1'},

      <dt>Crew</dt><dd>${o.crewId?esc(user(o.crewId).name):'Not assigned yet'}</dd>
      <dt>Details</dt><dd style="white-space:pre-wrap">${esc(o.desc||'—')}</dd>
    </dl></div>
    ${actions}
    ${docs.length?`<div class="stack"><h3>Estimates & invoices</h3>${docs.map(d=>docCard(d,r)).join('')}</div>`:''}
    <div class="stack"><h3>Activity</h3><ul class="timeline">${[...o.log].reverse().map(l=>`<li><div>${esc(l.text)}<small>${esc(l.by)} · ${fmtDT(l.t)}</small></div></li>`).join('')}</ul></div>
  </div></div>`;
}
function logTo(o, text){ o.log.push({t:Date.now(),by:me().name,text}); }

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-scrim]'); if(!b) return;
  if(b.matches('[data-scrim]')){ if(e.target===b) closeSheet(); return; }
  const d = b.dataset;
  if(d.role){ S.role=d.role; closeSheet(); render(); window.scrollTo(0,0); return; }
  if(d.view){ S.views[S.role]=d.view; render(); window.scrollTo(0,0); return; }
  if(d.open){ openSheet(d.open); return; }
  if(d.cat){ draft.category=d.cat; keepForm(()=>render()); return; }
  if(d.prio){ draft.priority=d.prio; keepForm(()=>render()); return; }
  if(d.day){ draft.day=+d.day; if(draft.slot!=null && slotTaken(draft.day,draft.slot)) draft.slot=null; keepForm(()=>render()); return; }
  if(d.slot!=null && d.slot!==''){ draft.slot=+d.slot; keepForm(()=>render()); return; }
  if(d.wof){ woFilter=d.wof; render(); return; }
  if(d.tbl){ tableSel=d.tbl; render(); return; }
  if(d.inv){ inviteBy=d.inv; render(); return; }
  if(d.pick){ const o=order(d.pick); o.crewId=me().id; if(o.status==='New') o.status='Scheduled'; logTo(o,'Picked up by '+me().name); toast(`${o.id} is now on your list`); render(); if(sheetId) renderSheet(); return; }
  if(d.ovr){ const o=S.overrides.find(x=>x.id===d.ovr); o.status = d.ok==='1'?'Approved':'Denied';
    if(o.status==='Approved') S.time.push({id:uid('T'),userId:o.userId,siteId:o.siteId,in:o.at,out:o.at+8*HR,status:'Override'});
    toast(`Override ${o.status.toLowerCase()} for ${user(o.userId).name}`); render(); return; }
  if(d.doc){ const doc=S.docs.find(x=>x.id===d.doc), o=order(doc.woId);
    if(d.do==='approve'){ doc.status='Approved'; logTo(o,`Estimate ${doc.id} approved`); toast('Estimate approved. The crew can get started.'); }
    if(d.do==='send'){ doc.status='Sent'; logTo(o,`${doc.id} sent to customer`); toast(`${doc.id} sent`); }
    if(d.do==='invoice'){ const id='INV-'+(S.seq.inv++); S.docs.push({id,type:'invoice',woId:o.id,status:'Sent',createdAt:Date.now(),lines:doc.lines.map(l=>({...l}))}); logTo(o,`Invoice ${id} created from ${doc.id}`); toast(`${id} created and sent`); }
    if(d.do==='paid'){ doc.status='Paid'; logTo(o,`Invoice ${doc.id} marked paid`); toast(`${doc.id} marked paid`); }
    render(); if(sheetId) renderSheet(); return; }
  if(d.rmline!=null && d.rmline!==''){ readEst(); estDraft.splice(+d.rmline,1); if(!estDraft.length) estDraft.push({d:'',q:1,p:0}); renderSheet(); return; }
  const act = d.act; if(!act) return;
  const m = me();
  if(act==='close') return closeSheet();
  if(act==='reset'){ const role=S.role; S=seed(); S.role=role; S.views.management='notes'; toast('Demo data reset'); render(); return; }
  if(act==='clockin'){ const here=S.gps[m.id]; S.time.push({id:uid('T'),userId:m.id,siteId:here,in:Date.now(),out:null,status:'Approved'}); toast('Clocked in at '+site(here).name); render(); return; }
  if(act==='clockout'){ const sh=openShift(m.id); sh.out=Date.now(); toast(`Clocked out · ${((sh.out-sh.in)/HR).toFixed(2)} h`); render(); return; }
  if(act==='override'){ const here=S.gps[m.id]||'home'; const pos=here==='home'?{lat:40.7790,lng:-73.9600}:site(here); const near=S.sites.map(s=>({s,d:dist(pos,s)})).sort((a,b)=>a.d-b.d)[0];
    S.overrides.push({id:uid('O'),userId:m.id,siteId:near.s.id,at:Date.now(),reason:'Requested from the clock screen',distance:Math.round(near.d),status:'Pending'}); toast('Override requested. Management will see it on their overview.'); render(); return; }
  if(act==='csv'){ const rows=TABLES[tableSel](); const cols=rows.length?Object.keys(rows[0]):[]; const q=v=>{ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const csv=[cols.join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n');
    navigator.clipboard.writeText(csv).then(()=>toast(`Copied ${rows.length} rows of ${tableSel}`),()=>toast('Copy was blocked here. Select the table and copy it instead.')); return; }
  if(act==='newinternal'){ const id='WO-'+(S.seq.wo++); S.orders.push({id,title:'New internal job',category:'Other',customerId:null,siteId:'s3',unit:'',desc:'',priority:'normal',status:'New',crewId:null,apptDate:null,apptSlot:0,createdAt:Date.now(),completedAt:null,log:[{t:Date.now(),by:m.name,text:'Internal job created'}]}); render(); openSheet(id); return; }
  if(act==='newest'){ estDraft=[{d:'Labor',q:1,p:75},{d:'Materials',q:1,p:0}]; renderSheet(); return; }
  if(act==='addline'){ readEst(); estDraft.push({d:'',q:1,p:0}); renderSheet(); return; }
  if(act==='cancelest'){ estDraft=null; renderSheet(); return; }
  const o = sheetId && order(sheetId);
  if(act==='start' && o){ o.status='In progress'; logTo(o,'Work started'); toast('Job started'); render(); renderSheet(); return; }
  if(act==='complete' && o){ o.status='Completed'; o.completedAt=Date.now(); logTo(o,'Marked complete'); toast(`${o.id} completed`); render(); renderSheet(); return; }
  if(act==='note' && o){ const t=$('#pnote').value.trim(); if(!t) return toast('Write a note first.'); logTo(o,t); renderSheet(); toast('Note added'); return; }
  if(act==='expense' && o){ const a=parseFloat($('#xamt').value); if(!(a>0)) return toast('Enter an amount above $0.'); S.exp.push({id:uid('X'),date:Date.now(),category:'Materials',vendor:$('#xven').value.trim()||'Unspecified',amount:a,woId:o.id,by:m.id}); logTo(o,`Logged ${money2(a)} materials`); toast('Expense logged'); save(); renderSheet(); return; }
});
function readEst(){ document.querySelectorAll('[data-el]').forEach(i=>{ const l=estDraft[+i.dataset.el]; if(l) l[i.dataset.k] = i.dataset.k==='d'?i.value:(+i.value||0); }); }
function keepForm(fn){ const keep={}; ['rq-unit','rq-title','rq-desc','rq-site'].forEach(id=>{ const el=document.getElementById(id); if(el) keep[id]=el.value; }); fn(); Object.entries(keep).forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.value=v; }); }
document.addEventListener('input', e => {
  const t=e.target;
  if(t.dataset.ans!=null && t.dataset.ans!==''){ S.answers[t.dataset.ans]=t.value; save(); }
  if(t.dataset.el!=null && t.dataset.el!==''){ readEst(); const tot=$('#estTotal'); if(tot) tot.textContent=money2(estDraft.reduce((a,l)=>a+l.q*l.p,0)); }
});
document.addEventListener('change', e => {
  const t=e.target, d=t.dataset;
  if(t.id==='biz'){ S.biz=t.value; toast('Switched to '+t.value); render(); return; }
  if(t.id==='gps'){ S.gps[me().id]=t.value; render(); return; }
  const o = d.assign!==undefined ? order(d.assign) : d.status!==undefined ? order(d.status) : d.aday!==undefined ? order(d.aday) : d.aslot!==undefined ? order(d.aslot) : null;
  if(!o) return;
  if(d.assign!==undefined){ o.crewId=t.value||null; if(o.crewId && o.status==='New') o.status='Scheduled'; logTo(o, o.crewId?'Assigned to '+user(o.crewId).name:'Unassigned'); }
  if(d.status!==undefined){ o.status=t.value; o.completedAt = t.value==='Completed'?Date.now():null; logTo(o,'Status set to '+t.value); }
  if(d.aday!==undefined){ o.apptDate=t.value?+t.value:null; if(o.apptDate!=null && o.status==='New') o.status='Scheduled'; logTo(o, o.apptDate!=null?`Scheduled for ${fmtDay(o.apptDate)}, ${SLOTS[o.apptSlot]}`:'Appointment cleared'); }
  if(d.aslot!==undefined){ o.apptSlot=+t.value; if(o.apptDate!=null) logTo(o,`Time changed to ${SLOTS[o.apptSlot]}`); }
  render(); renderSheet();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.id==='reqForm'){
    const title=$('#rq-title').value.trim(), desc=$('#rq-desc').value.trim(), err=$('#rq-err');
    if(!title){ err.innerHTML='<div class="notice bad">Add a short title so the crew knows what the job is.</div>'; $('#rq-title').focus(); return; }
    if(draft.slot==null){ err.innerHTML='<div class="notice bad">Pick an appointment time, or choose any open slot and we\'ll confirm it.</div>'; return; }
    const id='WO-'+(S.seq.wo++), m=me();
    S.orders.push({id,title,category:draft.category,customerId:m.id,siteId:$('#rq-site').value,unit:$('#rq-unit').value.trim(),desc,priority:draft.priority,status:'New',crewId:null,apptDate:draft.day,apptSlot:draft.slot,createdAt:Date.now(),completedAt:null,
      log:[{t:Date.now(),by:m.name,text:`Request submitted for ${fmtDay(draft.day)}, ${SLOTS[draft.slot]}`}]});
    draft={category:'Plumbing',priority:'normal',day:null,slot:null};
    S.views.customer='mine'; toast(`Request ${id} submitted`); render(); openSheet(id); return;
  }
  if(e.target.id==='inviteForm'){
    const name=$('#iv-name').value.trim(), c=$('#iv-contact').value.trim(), role=$('#iv-role').value, err=$('#iv-err');
    const ok = inviteBy==='email' ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c) : c.replace(/\D/g,'').length>=10;
    if(!name){ err.innerHTML='<div class="notice bad">Add the person\'s name.</div>'; return; }
    if(!ok){ err.innerHTML=`<div class="notice bad">${inviteBy==='email'?'That email address doesn\'t look complete.':'Enter a 10-digit phone number.'}</div>`; return; }
    S.users.push({id:uid('u'),name,role,email:inviteBy==='email'?c:'',phone:inviteBy==='phone'?c:'',status:'Invited',rate:role==='crew'?25:undefined});
    toast(`Invite recorded for ${name}`); render(); return;
  }
  if(e.target.id==='estForm'){
    readEst(); const lines=estDraft.filter(l=>l.d.trim() && l.q>0);
    if(!lines.length) return toast('Add at least one line with a description and quantity.');
    const o=order(sheetId), id='EST-'+(S.seq.est++);
    S.docs.push({id,type:'estimate',woId:o.id,status:'Sent',createdAt:Date.now(),lines}); logTo(o,`Estimate ${id} sent (${money2(lines.reduce((a,l)=>a+l.q*l.p,0))})`);
    estDraft=null; toast(`${id} sent to customer`); render(); renderSheet();
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheetId) closeSheet(); });

fromHash();
render();
const qOpen = /[?&]open=(WO-\d+)/.exec(location.search); if(qOpen && order(qOpen[1])) openSheet(qOpen[1]);
})();
</script>
